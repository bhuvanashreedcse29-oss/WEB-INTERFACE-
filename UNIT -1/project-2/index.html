<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Profile</h1>

    <div class="form">
        <input type="text" id="name" placeholder="Enter Student Name">

        <input type="text" id="roll" placeholder="Enter Roll Number">

        <input type="number" id="marks" placeholder="Enter Marks">

        <button onclick="displayProfile()">
            Display Profile
        </button>
    </div>

    <div class="card" id="profileCard">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

        <h2 id="studentName"></h2>

        <p><b>Roll No :</b> <span id="studentRoll"></span></p>

        <p><b>Marks :</b> <span id="studentMarks"></span></p>

        <p><b>Grade :</b> <span id="studentGrade"></span></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
